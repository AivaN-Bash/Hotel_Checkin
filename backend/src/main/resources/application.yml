spring:
  application:
    name: hotel-checkin-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  datasource:
    hikari:
      connection-timeout: 2000
      validation-timeout: 1500
      maximum-pool-size: 5
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://frontend-nine-kohl-nzqk24mi4s.vercel.app}"
  maintenance:
    enabled: ${MAINTENANCE_MODE:false}
  admin:
    api-key: ${ADMIN_API_KEY:}
springdoc:
  swagger-ui:
    path: /swagger-ui
